name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib-only on purpose — cryptography is needed for one auth mode and is
      # imported inside that branch, so the suites must pass without it installed.
      # That is what this job proves by never installing it.
      - run: python -m compileall -q amo cws edge native tests
      # Ruff is pinned: without a version, a new release's default rules can fail
      # a build nobody changed. The rule set itself lives in ruff.toml.
      - run: pip install --quiet ruff==0.16.3 && ruff check .
      # The native host's confinement is the one thing here that must not
      # regress silently — a weakened check still reads every file it used to.
      - run: python tests/test_native_host.py
      # Request bodies, URLs and the auth-mode choice: the failures that would be
      # accepted by the store and do the wrong thing.
      - run: python tests/test_cws_publish.py
      # The two config loaders are duplicated on purpose; this is what stops them
      # from drifting into meaning different things for the same file.
      - run: python tests/test_edge_publish.py
      - run: python tests/test_config_parity.py

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every background script the manifest lists must exist, and the host
      # manifest must allow exactly the add-on's own id — a mismatch fails at
      # connect time with a message that points nowhere useful.
      - name: manifest and native host agree
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          manifest = json.loads(Path('extension/manifest.json').read_text())
          problems = []
          for script in manifest['background']['scripts']:
              if not (Path('extension') / script).is_file():
                  problems.append(f'manifest lists a missing script: {script}')
          if not (Path('extension') / manifest['action']['default_popup']).is_file():
              problems.append('manifest lists a missing popup')

          ext_id = manifest['browser_specific_settings']['gecko']['id']
          host = json.loads(Path('native/host-manifest.example.json').read_text())
          if host['allowed_extensions'] != [ext_id]:
              problems.append(f"host allows {host['allowed_extensions']}, add-on id is {ext_id}")

          # config.json must sit beside the manifest: the popup reads it with
          # chrome.runtime.getURL, which can only see the add-on's own directory.
          # Anywhere else and Firefox fails the fetch with a bare network error.
          if not Path('extension/config.example.json').is_file():
              problems.append('config.example.json must live in extension/, beside the manifest')
          for script in ('amo/amo_publish.py', 'cws/cws_publish.py',
                         'edge/edge_publish.py'):
              if 'REPO_ROOT / "extension" / "config.json"' not in Path(script).read_text():
                  problems.append(f'{script} must default to the same extension/config.json')

          if problems:
              sys.exit('\n'.join(problems))
          print('manifest OK')
          PY
